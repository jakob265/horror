name: Build Vesper

# Builds double-clickable game binaries on every push to the feature branch.
# Grab them from the run's "Artifacts" (Actions tab, or the PR's Checks tab):
# download VesperHorror-Windows, unzip, double-click VesperHorror.exe. No
# Godot install, no editor, no dependencies.
#
# Tag a commit `v*` to also publish a GitHub Release with the binaries zipped.
#
# Uses the barichello/godot-ci image, which bundles Godot 4.3 + the matching
# export templates.

on:
  push:
    branches: [claude/improve-visual-assets-tvk28]
    tags: ['v*']
  workflow_dispatch:

env:
  PROJECT_DIR: godot

# A newer push to the same branch cancels the older, now-superseded run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile every script + instantiate every scene. An exported build ships
  # even with a GDScript parse error (it just crashes at runtime), so this is
  # the gate that actually catches broken code before we build/ship it.
  validate:
    name: Validate scripts
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Compile scripts + scenes
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # Import pass generates the script-class cache. It prints benign
          # warnings, so we do NOT gate on its output - only run it.
          godot --headless --import . > /tmp/import.log 2>&1 || true

          # The validator's exit code is the source of truth. Capture it via
          # PIPESTATUS so the tee pipe doesn't mask it.
          set +e
          godot --headless --script res://tools/ci_check.gd 2>&1 | tee /tmp/check.log
          rc=${PIPESTATUS[0]}
          set -e

          # Surface real parse/compile errors (and our own FAIL lines) as
          # GitHub annotations so the failing file is visible without raw logs.
          grep -inE "SCRIPT ERROR|parse error|cannot infer|CI_CHECK FAIL" /tmp/check.log \
            | while IFS= read -r line; do echo "::error::$line"; done || true

          if [ "$rc" -ne 0 ] || ! grep -q "CI_CHECK OK" /tmp/check.log; then
            echo "::error::GDScript validation failed (exit=$rc). See annotations above."
            exit 1
          fi
          echo "All scripts and scenes validated."

  export:
    name: Export ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            preset: "Windows Desktop"
            out: build/windows/VesperHorror.exe
            artifact: VesperHorror-Windows
            dir: build/windows
          - name: Linux
            preset: "Linux/X11"
            out: build/linux/VesperHorror.x86_64
            artifact: VesperHorror-Linux
            dir: build/linux
    steps:
      - uses: actions/checkout@v4

      - name: Prepare export templates
        # The barichello image installs templates under /root, but GitHub
        # Actions container jobs run with HOME=/github/home, so Godot looks in
        # the wrong place and "no export template found" kills the export.
        # Copy them to where Godot will actually look for this job.
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -r /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/" || true
          echo "Templates present:"
          ls -la "$HOME/.local/share/godot/export_templates/"

      - name: Export ${{ matrix.name }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p ${{ matrix.dir }}
          # Import first so the script-class cache + resources are generated,
          # then export. The game is fully procedural (no image/audio assets),
          # so import is fast; tolerate its non-zero exit.
          godot --headless --import . || true
          godot --headless --verbose --export-release "${{ matrix.preset }}" ${{ matrix.out }}
          echo "--- output ---"
          ls -la ${{ matrix.dir }}
          test -s ${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.PROJECT_DIR }}/${{ matrix.dir }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip per-platform builds
        run: |
          cd dist
          for d in */; do
            (cd "$d" && zip -r "../${d%/}.zip" .)
          done
          ls -la
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
